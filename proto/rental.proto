// ---------------------------------------------------------------------------
// DSA612S Assignment 1 - Question 2
// Ministry of Tourism - Rental Accommodation System
//
// Four RPC styles are exercised as the brief requires:
//   simple (unary)     add_property, update_property, remove_property,
//                      search_property, book_property, confirm_booking,
//                      cancel_booking, rate_property
//   client streaming   create_users
//   server streaming   list_available_properties
//
// cancel_booking and rate_property go beyond the brief's minimum RPC list:
// cancel_booking completes the booking lifecycle (book -> confirm -> cancel)
// by freeing a confirmed stay's dates back up, and rate_property lets a
// Guest leave a 1-5 rating after a stay, with the running average shown on
// every listing.
//
// Dates travel as ISO-8601 calendar dates ("YYYY-MM-DD") and money as double,
// so the wire format stays readable in grpcurl output and in server logs.
// ---------------------------------------------------------------------------

syntax = "proto3";

package rental;

service RentalService {

    // A Host registers a new listing; the server allocates the property_id.
    rpc add_property (AddPropertyRequest) returns (AddPropertyResponse);

    // Client-side streaming: many user profiles are streamed to the server,
    // which replies once, after the stream completes.
    rpc create_users (stream UserProfile) returns (CreateUsersResponse);

    // A Host edits an existing listing, keyed on property_id.
    rpc update_property (UpdatePropertyRequest) returns (UpdatePropertyResponse);

    // A Host removes a listing; the server replies with the remaining
    // listings that Host still has in that region.
    rpc remove_property (RemovePropertyRequest) returns (RemovePropertyResponse);

    // Server-side streaming: matching listings are streamed back one by one.
    rpc list_available_properties (ListPropertiesRequest) returns (stream Property);

    // A Guest looks up one listing by id.
    rpc search_property (SearchPropertyRequest) returns (SearchPropertyResponse);

    // A Guest puts a dated stay into a temporary booking cart.
    rpc book_property (BookPropertyRequest) returns (BookPropertyResponse);

    // The cart is re-validated, priced, and turned into confirmed bookings.
    rpc confirm_booking (ConfirmBookingRequest) returns (ConfirmBookingResponse);

    // A Guest cancels one of their own confirmed bookings, freeing the dates.
    rpc cancel_booking (CancelBookingRequest) returns (CancelBookingResponse);

    // A Guest leaves a 1-5 rating (and an optional review) for a property.
    rpc rate_property (RatePropertyRequest) returns (RatePropertyResponse);
}

// -------------------------------- entities ----------------------------------

// account_type: "HOST" or "GUEST".
message UserProfile {
    string user_id = 1;
    string full_name = 2;
    string email = 3;
    string account_type = 4;
    string phone = 5;
}

// listing_status: "AVAILABLE" or "UNAVAILABLE".
// category: "APARTMENT", "GUESTHOUSE", "LODGE", "CAMPSITE", "HOUSE".
// average_rating is 0 until rate_property has been called at least once;
// rating_count says how many ratings that average is built from.
message Property {
    string property_id = 1;
    string host_id = 2;
    string title = 3;
    string location = 4;
    string region = 5;
    string category = 6;
    double nightly_rate = 7;
    string listing_status = 8;
    int32 max_guests = 9;
    string summary = 10;
    double average_rating = 11;
    int32 rating_count = 12;
}

message Booking {
    string booking_id = 1;
    string property_id = 2;
    string property_title = 3;
    string guest_id = 4;
    string check_in = 5;
    string check_out = 6;
    int32 nights = 7;
    double nightly_rate = 8;
    double total_cost = 9;
    string booking_status = 10;
}

// ------------------------------- add_property --------------------------------

message AddPropertyRequest {
    string host_id = 1;
    string title = 2;
    string location = 3;
    string region = 4;
    string category = 5;
    double nightly_rate = 6;
    string listing_status = 7;
    int32 max_guests = 8;
    string summary = 9;
}

message AddPropertyResponse {
    bool success = 1;
    string property_id = 2;
    string details = 3;
}

// ------------------------------- create_users ---------------------------------

message CreateUsersResponse {
    bool success = 1;
    int32 accepted_count = 2;
    int32 rejected_count = 3;
    repeated string accepted_user_ids = 4;
    repeated string rejections = 5;
    string details = 6;
}

// ----------------------------- update_property --------------------------------

// An empty string or a zero value on any field below means "leave this field
// unchanged", which keeps the message usable as a partial update without
// relying on proto3 explicit field presence.
message UpdatePropertyRequest {
    string property_id = 1;
    string host_id = 2;
    string title = 3;
    string location = 4;
    string region = 5;
    string category = 6;
    double nightly_rate = 7;
    string listing_status = 8;
    int32 max_guests = 9;
    string summary = 10;
}

message UpdatePropertyResponse {
    bool success = 1;
    string details = 2;
    Property property = 3;
}

// ----------------------------- remove_property ---------------------------------

message RemovePropertyRequest {
    string property_id = 1;
    string host_id = 2;
}

message RemovePropertyResponse {
    bool success = 1;
    string details = 2;
    repeated Property remaining_properties = 3;
}

// ------------------------- list_available_properties ----------------------------

// Every filter is optional: an empty string or a zero value disables it.
message ListPropertiesRequest {
    string location = 1;
    string region = 2;
    double min_rate = 3;
    double max_rate = 4;
    int32 guests = 5;
    string check_in = 6;
    string check_out = 7;
}

// ------------------------------ search_property ----------------------------------

message SearchPropertyRequest {
    string property_id = 1;
}

message SearchPropertyResponse {
    bool available = 1;
    string details = 2;
    Property property = 3;
}

// ------------------------------- book_property ------------------------------------

message BookPropertyRequest {
    string guest_id = 1;
    string property_id = 2;
    string check_in = 3;
    string check_out = 4;
    int32 guests = 5;
}

message BookPropertyResponse {
    bool accepted = 1;
    string details = 2;
    string cart_item_id = 3;
    int32 nights = 4;
    double estimated_total = 5;
}

// ----------------------------- confirm_booking -------------------------------------

// An empty cart_item_id confirms every item currently in the Guest's cart.
message ConfirmBookingRequest {
    string guest_id = 1;
    string cart_item_id = 2;
}

message ConfirmBookingResponse {
    bool confirmed = 1;
    string details = 2;
    repeated Booking bookings = 3;
    double grand_total = 4;
    repeated string rejections = 5;
}

// ----------------------------- cancel_booking -------------------------------------

message CancelBookingRequest {
    string guest_id = 1;
    string booking_id = 2;
}

message CancelBookingResponse {
    bool cancelled = 1;
    string details = 2;
}

// ----------------------------- rate_property --------------------------------------

message RatePropertyRequest {
    string guest_id = 1;
    string property_id = 2;
    int32 rating = 3;
    string review = 4;
}

message RatePropertyResponse {
    bool accepted = 1;
    string details = 2;
    double average_rating = 3;
    int32 rating_count = 4;
}
